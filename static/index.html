<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transformer 试诗台</title>
    <style>
      :root {
        --ink: #050505;
        --ink-soft: #050505;
        --paper: #f7f3ea;
        --panel: rgba(255, 253, 247, 0.58);
        --wash: #ebe3d6;
        --line: rgba(25, 23, 19, 0.18);
        --cinnabar: #b73428;
        --jade: #236857;
        --blue: #27516e;
        --gold: #a8782c;
        --muted: #050505;
        --faint: rgba(25, 23, 19, 0.06);
        --shadow: rgba(47, 36, 24, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
        font-weight: 560;
        background: transparent;
        position: relative;
        isolation: isolate;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background: url("/static/assets/mountain-ink-bg.png") center center / cover no-repeat;
        filter: contrast(1.08) saturate(1.02) brightness(1.04);
        opacity: 0.68;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(rgba(255, 255, 255, 0.14), rgba(247, 243, 234, 0.2));
      }

      button,
      input,
      select {
        font: inherit;
      }

      .shell {
        width: min(1280px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 22px 0 30px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: end;
        gap: 24px;
        padding-bottom: 14px;
        border-bottom: 2px solid var(--ink);
      }

      .eyebrow {
        color: var(--ink);
        font-size: 13px;
        letter-spacing: 0.16em;
      }

      .lede {
        width: min(680px, 100%);
        margin: 8px 0 0;
        color: var(--muted);
        font-weight: 620;
        font-size: 15px;
        line-height: 1.55;
      }

      h1 {
        margin: 4px 0 0;
        font-size: clamp(38px, 6vw, 84px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      .status {
        min-height: 82px;
        padding: 12px 16px;
        border-left: 5px solid var(--blue);
        background: rgba(255, 253, 247, 0.055);
        box-shadow: 0 18px 48px rgba(47, 36, 24, 0.08);
        backdrop-filter: blur(1px) saturate(1.02);
      }

      .status strong {
        display: block;
        margin-bottom: 5px;
        font-size: 18px;
      }

      .status span,
      .meta,
      label {
        color: var(--muted);
        font-weight: 620;
      }

      .workspace {
        display: grid;
        grid-template-columns: 344px minmax(0, 1fr);
        gap: 22px;
        margin-top: 18px;
      }

      .panel {
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(255, 253, 247, 0.045), rgba(255, 253, 247, 0.012)),
          rgba(255, 253, 247, 0.015);
        box-shadow: 0 28px 80px rgba(47, 36, 24, 0.055);
        backdrop-filter: blur(1px) saturate(1.02);
      }

      .controls {
        align-self: start;
        position: sticky;
        top: 18px;
        padding: 17px 20px;
      }

      .control-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 13px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .control-title strong {
        font-size: 18px;
      }

      .pill {
        border: 1px solid var(--line);
        background: rgba(39, 81, 110, 0.045);
        padding: 5px 9px;
        color: var(--ink);
        font-size: 12px;
      }

      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 12px;
      }

      label {
        font-size: 13px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        border: 0;
        border-bottom: 2px solid var(--ink);
        background: rgba(255, 253, 247, 0.055);
        color: var(--ink);
        outline: none;
        padding: 6px 2px;
        font-size: 20px;
        font-weight: 620;
        transition: border-color 160ms ease, background 160ms ease;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      select:focus {
        border-color: var(--cinnabar);
        background: rgba(255, 253, 247, 0.16);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--cinnabar);
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--cinnabar);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .value-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-variant-numeric: tabular-nums;
      }

      .check-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 46px;
        gap: 10px;
      }

      button {
        min-height: 44px;
        border: 2px solid var(--ink);
        color: var(--ink);
        background: rgba(255, 253, 247, 0.08);
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(25, 23, 19, 0.14);
        transition: transform 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 36px rgba(25, 23, 19, 0.18);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
        transform: none;
      }

      .ghost {
        color: var(--ink);
        background: rgba(255, 253, 247, 0.055);
        box-shadow: none;
      }

      .output {
        min-height: 620px;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        background: transparent;
        backdrop-filter: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.028),
          0 24px 70px rgba(47, 36, 24, 0.035);
      }

      .output-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: transparent;
      }

      .output-head h2 {
        margin: 0;
        font-size: 19px;
      }

      .progress-zone {
        display: grid;
        gap: 10px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(183, 52, 40, 0.006), rgba(35, 104, 87, 0.006)),
          rgba(255, 253, 247, 0.003);
        backdrop-filter: none;
      }

      .progress-copy {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-weight: 620;
        font-size: 14px;
      }

      .progress-track {
        height: 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: rgba(25, 23, 19, 0.08);
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--cinnabar), var(--gold), var(--jade));
        transition: width 180ms ease;
      }

      .result-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 326px;
        min-height: 0;
      }

      .poem {
        margin: 0;
        min-height: 470px;
        max-height: 720px;
        padding: 34px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        writing-mode: vertical-rl;
        font-size: clamp(24px, 3.2vw, 38px);
        line-height: 1.74;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.65),
          0 8px 22px rgba(255, 253, 247, 0.65);
        background: transparent;
      }

      .empty {
        color: var(--muted);
        font-weight: 620;
        font-size: 20px;
      }

      .ranked {
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 18px;
        border-left: 1px solid var(--line);
        background:
          linear-gradient(180deg, rgba(255, 253, 247, 0.006), rgba(255, 253, 247, 0.001)),
          rgba(255, 253, 247, 0.002);
        backdrop-filter: none;
      }

      .ranked-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-weight: 620;
        font-size: 13px;
      }

      .candidate {
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(255, 253, 247, 0.028), rgba(255, 253, 247, 0.006)),
          rgba(255, 253, 247, 0.008);
        padding: 13px;
        box-shadow: 0 12px 32px rgba(47, 36, 24, 0.055);
        backdrop-filter: none;
      }

      .candidate-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        color: var(--ink);
        font-size: 13px;
      }

      .candidate:first-child {
        border-color: rgba(183, 52, 40, 0.36);
      }

      .candidate:first-child .candidate-head strong {
        color: var(--ink);
      }

      .candidate pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--ink-soft);
        font-size: 15px;
        line-height: 1.7;
      }

      .empty-state {
        border: 1px dashed var(--line);
        background: rgba(255, 253, 247, 0.003);
        padding: 14px;
        color: var(--muted);
        font-weight: 620;
        font-size: 14px;
        line-height: 1.6;
      }

      .error {
        color: var(--ink);
      }

      @media (max-width: 980px) {
        .masthead,
        .workspace,
        .result-grid {
          grid-template-columns: 1fr;
        }

        .controls {
          position: static;
        }

        .ranked {
          border-left: 0;
          border-top: 1px solid var(--line);
        }

        .poem {
          writing-mode: horizontal-tb;
          min-height: 300px;
          font-size: 25px;
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100vw - 22px, 1280px);
          padding-top: 18px;
        }

        .row {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 36px;
          line-height: 0.96;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <div class="eyebrow">CAUSAL TRANSFORMER · 2.8M</div>
          <h1>Transformer 试诗台</h1>
          <p class="lede">结构约束、重复惩罚、自适应温度和候选重排同时工作；默认保持 50 个候选采样，并把排序靠前的结果展示出来。</p>
        </div>
        <aside class="status" id="status">
          <strong>检查模型中</strong>
          <span>正在读取 checkpoint</span>
        </aside>
      </header>

      <section class="workspace">
        <form class="panel controls" id="form">
          <div class="control-title">
            <strong>生成参数</strong>
            <span class="pill">近体诗</span>
          </div>

          <div class="field">
            <label for="start">起始文字</label>
            <input id="start" name="start" type="text" value="春" maxlength="12" />
          </div>

          <div class="field">
            <label for="poemForm">体裁</label>
            <select id="poemForm" name="poemForm">
              <option value="五言绝句">五言绝句</option>
              <option value="七言绝句" selected>七言绝句</option>
              <option value="五言律诗">五言律诗</option>
              <option value="七言律诗">七言律诗</option>
            </select>
          </div>

          <div class="field">
            <div class="value-line">
              <label for="temperature">温度</label>
              <span id="temperatureValue">0.60</span>
            </div>
            <input id="temperature" name="temperature" type="range" min="0" max="1.6" step="0.05" value="0.6" />
          </div>

          <div class="row">
            <div class="field">
              <label for="length">续写字数</label>
              <input id="length" name="length" type="number" min="10" max="240" value="80" />
            </div>
            <div class="field">
              <label for="topk">Top-k</label>
              <input id="topk" name="topk" type="number" min="0" max="200" value="40" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="candidates">候选采样</label>
              <input id="candidates" name="candidates" type="number" min="1" max="50" value="50" />
            </div>
            <div class="field">
              <label for="topN">展示 Top N</label>
              <input id="topN" name="topN" type="number" min="1" max="10" value="3" />
            </div>
          </div>

          <div class="field">
            <div class="value-line">
              <label for="repetitionPenalty">重复惩罚</label>
              <span id="repetitionPenaltyValue">1.50</span>
            </div>
            <input id="repetitionPenalty" name="repetitionPenalty" type="range" min="1" max="2.5" step="0.05" value="1.5" />
          </div>

          <div class="field">
            <label for="repetitionWindow">惩罚窗口</label>
            <input id="repetitionWindow" name="repetitionWindow" type="number" min="8" max="240" value="64" />
          </div>

          <label class="check-field" for="adaptiveTemperature">
            <span>自适应温度</span>
            <input id="adaptiveTemperature" name="adaptiveTemperature" type="checkbox" checked />
          </label>

          <div class="button-row">
            <button id="generate" type="submit">生成</button>
            <button class="ghost" id="clear" type="button" title="清空输出">×</button>
          </div>
        </form>

        <section class="panel output">
          <div class="output-head">
            <h2>模型输出</h2>
            <span class="meta" id="runMeta">等待生成</span>
          </div>
          <div class="progress-zone">
            <div class="progress-copy">
              <span id="progressText">采样器待命</span>
              <span id="progressCount">0 / 0</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
          <div class="result-grid">
            <pre class="poem empty" id="poem">点“生成”后，这里会显示训练模型续写的诗句。</pre>
            <aside class="ranked">
              <div class="ranked-title">
                <span>Top-N 候选</span>
                <span id="scoreMeta">scorer 待命</span>
              </div>
              <div id="rankedList">
                <div class="empty-state">生成完成后，这里会列出分数靠前的候选，方便比较模型的不同采样结果。</div>
              </div>
            </aside>
          </div>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector("#form");
      const statusBox = document.querySelector("#status");
      const poem = document.querySelector("#poem");
      const runMeta = document.querySelector("#runMeta");
      const progressText = document.querySelector("#progressText");
      const progressCount = document.querySelector("#progressCount");
      const progressFill = document.querySelector("#progressFill");
      const rankedList = document.querySelector("#rankedList");
      const scoreMeta = document.querySelector("#scoreMeta");
      const generateButton = document.querySelector("#generate");
      const temperature = document.querySelector("#temperature");
      const temperatureValue = document.querySelector("#temperatureValue");
      const repetitionPenalty = document.querySelector("#repetitionPenalty");
      const repetitionPenaltyValue = document.querySelector("#repetitionPenaltyValue");

      temperature.addEventListener("input", () => {
        temperatureValue.textContent = Number(temperature.value).toFixed(2);
      });

      repetitionPenalty.addEventListener("input", () => {
        repetitionPenaltyValue.textContent = Number(repetitionPenalty.value).toFixed(2);
      });

      document.querySelector("#clear").addEventListener("click", () => {
        poem.textContent = "";
        poem.classList.add("empty");
        runMeta.textContent = "已清空";
        progressText.textContent = "采样器待命";
        progressCount.textContent = "0 / 0";
        progressFill.style.width = "0%";
        rankedList.innerHTML = `<div class="empty-state">生成完成后，这里会列出分数靠前的候选，方便比较模型的不同采样结果。</div>`;
        scoreMeta.textContent = "scorer 待命";
      });

      function setStatus(payload) {
        if (payload.ready) {
          statusBox.innerHTML = `<strong>模型已加载</strong><span>${payload.device} · vocab ${payload.vocab_size}</span>`;
          statusBox.classList.remove("error");
        } else {
          statusBox.innerHTML = `<strong>模型暂不能加载</strong><span>${payload.error || "缺少依赖"}</span>`;
          statusBox.classList.add("error");
        }
      }

      async function loadStatus() {
        const res = await fetch("/api/status");
        const payload = await res.json();
        setStatus(payload);
      }

      function generationPayload() {
        const candidates = Number(document.querySelector("#candidates").value);
        const topN = Math.min(Number(document.querySelector("#topN").value), candidates);
        return {
          start: document.querySelector("#start").value,
          form: document.querySelector("#poemForm").value,
          temperature: Number(document.querySelector("#temperature").value),
          max_new_tokens: Number(document.querySelector("#length").value),
          top_k: document.querySelector("#topk").value || null,
          candidates,
          top_n: topN,
          repetition_penalty: Number(document.querySelector("#repetitionPenalty").value),
          repetition_window: Number(document.querySelector("#repetitionWindow").value),
          adaptive_temperature: document.querySelector("#adaptiveTemperature").checked,
        };
      }

      function updateProgress(current, total) {
        progressText.textContent = `正在生成第 ${current} 首`;
        progressCount.textContent = `${current} / ${total}`;
        progressFill.style.width = `${Math.round((current / total) * 100)}%`;
      }

      function renderRanked(candidates) {
        rankedList.innerHTML = candidates.map((item) => `
          <article class="candidate">
            <div class="candidate-head">
              <strong>#${item.rank}</strong>
              <span>score ${item.rank_score}</span>
            </div>
            <pre>${item.text}</pre>
          </article>
        `).join("");
      }

      function handleStreamEvent(data) {
        if (data.event === "start") {
          progressText.textContent = "准备采样";
          progressCount.textContent = `0 / ${data.total}`;
          progressFill.style.width = "0%";
        }
        if (data.event === "progress") {
          updateProgress(data.current, data.total);
        }
        if (data.event === "final") {
          poem.textContent = data.text;
          poem.classList.remove("empty");
          renderRanked(data.candidates || []);
          const parts = data.score && data.score.parts ? data.score.parts : {};
          scoreMeta.textContent = `score ${data.score.rank_score}`;
          progressText.textContent = "生成完成";
          progressCount.textContent = `${data.settings.candidates} / ${data.settings.candidates}`;
          progressFill.style.width = "100%";
          runMeta.textContent = `${data.elapsed_ms} ms · ${data.device} · ${data.settings.candidates} 选 ${data.settings.top_n}`;
          if (parts.rhyme !== undefined) {
            scoreMeta.textContent = `score ${data.score.rank_score} · rhyme ${parts.rhyme}`;
          }
        }
        if (data.event === "error") {
          throw new Error(data.error);
        }
      }

      async function generateWithProgress(payload) {
        const res = await fetch("/api/generate_stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok || !res.body) {
          const fallback = await res.json().catch(() => ({}));
          throw new Error(fallback.error || "生成失败");
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (line.trim()) handleStreamEvent(JSON.parse(line));
          }
        }
        if (buffer.trim()) handleStreamEvent(JSON.parse(buffer));
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        poem.classList.remove("empty");
        poem.textContent = "生成中...";
        runMeta.textContent = "模型采样中";
        scoreMeta.textContent = "scorer 排序中";
        rankedList.innerHTML = "";
        generateButton.disabled = true;
        try {
          await generateWithProgress(generationPayload());
        } catch (error) {
          poem.textContent = error.message;
          poem.classList.add("empty");
          runMeta.textContent = "生成失败";
          progressText.textContent = "采样中断";
          scoreMeta.textContent = "scorer 未返回";
        } finally {
          generateButton.disabled = false;
        }
      });

      loadStatus().catch((error) => {
        setStatus({ ready: false, error: error.message });
      });
    </script>
  </body>
</html>
